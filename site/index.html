<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f8f4">
  <title>FINN — Investor desk</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="market-data.js"></script>
  <script defer src="data.js"></script>
  <script defer src="engine.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <a class="skip" href="#app">Skip to content</a>
  <header class="mast">
    <div class="mast-inner">
      <a class="brand" href="#brief" aria-label="FINN investor desk"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>FINN</a>
      <nav class="nav" aria-label="Investor desk" id="nav"></nav>
      <div class="mast-actions">
        <button id="mode" class="mode" type="button"><span class="dot"></span><span id="mode-label">Historical replay</span></button>
        <button id="settings" class="icon-button" type="button" aria-label="Alert settings" title="Alert settings"></button>
      </div>
    </div>
  </header>
  <main id="app" tabindex="-1"></main>
  <dialog id="dialog" aria-labelledby="dialog-title"></dialog>
  <div id="status" class="visually-hidden" role="status"></div>
  <noscript>This prototype needs JavaScript to show the digest, research and network.</noscript>
</body>
</html>
